# ============================================================== #
#                    SpawnGate - Правила сервера                 #
# ============================================================== #
# Палитра сервера: #008a61 и #057285
# Поддерживается MiniMessage: <gradient>, <color>, <bold>, <click>, <hover>.

pages:
  1:
    title: "<gradient:#008a61:#057285><b>[Страница 1/9] 📜 Раздел 1. Общие положения и Администрация</b></gradient>"
    lines:
      - "<color:#008a61><b>1.1.</b></color> <gray>Настоящие правила действуют на всех ресурсах проекта (сервер Minecraft, Discord-сервер и привязанные площадки) и обязательны для всех игроков без исключений.</gray>"
      - ""
      - "<color:#008a61><b>1.2.</b></color> <gray>Незнание правил не освобождает от ответственности за их нарушение.</gray>"
      - ""
      - "<color:#008a61><b>1.3.</b></color> <gray>Администрация поддерживает комфортную и ламповую атмосферу. Любые вопросы, споры, жалобы и заявки решаются исключительно через <b>систему тикетов в Discord</b>. Личные сообщения администраторам для рабочих вопросов закрыты.</gray>"
      - "<red>➜ [Нарушение: Попытки давления на администрацию в ЛС — Кик ➔ Мут от 1ч до 24ч]</red>"
      - ""
      - "<color:#008a61><b>1.4.</b></color> <gray>Старшая администрация оставляет за собой право принимать решения в нестандартных ситуациях, прямо не описанных в правилах, исходя из принципов справедливости и блага сервера.</gray>"

  2:
    title: "<gradient:#008a61:#057285><b>[Страница 2/9] 🏡 Раздел 2. Игровой процесс, Базы и Экология</b></gradient>"
    lines:
      - "<color:#008a61><b>2.1. Гриферство и воровство:</b></color> <gray>Запрещено ломать чужие постройки, воровать из чужих сундуков, портить механизмы и присваивать чужие ресурсы.</gray>"
      - "<red>➜ [Наказание: Бан от 7 дней до Перманентного + откат по /co rollback]</red>"
      - ""
      - "<color:#008a61><b>2.2. Приват табличками:</b></color> <gray>На сервере действует ванильный приват. Установка таблички с вашим ником закрепляет территорию базы, фермы или сундуки за вами. Снятие или игнорирование чужой таблички считается гриферством.</gray>"
      - "<red>➜ [Наказание: Варн + возврат территории ➔ при повторе Бан от 3 дней]</red>"
      - ""
      - "<color:#008a61><b>2.3. Правило добрососедства (Дистанция):</b></color> <gray>Запрещено селиться и строиться ближе чем в <b>300 блоках</b> от чужих баз и табличек без явного согласия соседа.</gray>"
      - "<red>➜ [Наказание: Предупреждение и 7 дней на перенос базы ➔ при отказе: Варн + принудительный снос]</red>"
      - ""
      - "<color:#008a61><b>2.4. PvP и убийства:</b></color> <gray>PvP разрешено <b>только по взаимному согласию</b>. Нападение или убийство без предупреждения приравнивается к гриферству.</gray>"
      - "<red>➜ [Наказание: Бан от 1 до 7 дней + полный возврат вещей жертве. При отказе вернуть вещи — Бан продлевается до Перманентного]</red>"
      - ""
      - "<color:#008a61><b>2.5. Заброшенные базы (Правило 30 дней):</b></color> <gray>База считается заброшенной, если её владелец не заходил в сеть <b>более 30 дней</b> (проверяется через <color:#008a61>/co i</color>). Её разрешено разбирать на ресурсы или заселять. Бессмысленный вандализм (взрывы ТНТ, заливка лавой) строго запрещён.</gray>"
      - "<red>➜ [Наказание за вандализм или лут активной базы: Варн ➔ Бан от 3 до 14 дней]</red>"
      - ""
      - "<color:#008a61><b>2.6. Иммунитет ферм:</b></color> <gray>Общественные и автоматические фермы ресурсов и опыта не считаются заброшенными, даже если создатель временно оффлайн. Их снос и присвоение запрещены.</gray>"
      - "<red>➜ [Наказание: Бан от 7 до 30 дней + откат]</red>"
      - ""
      - "<color:#008a61><b>2.7. Экология мира:</b></color>"
      - "  <dark_gray>•</dark_gray> <gray>Запрещено оставлять недорубленные деревья с летающей листвой.</gray>"
      - "  <dark_gray>•</dark_gray> <gray>Запрещено строить временные столбы 1×1 (вышки) без их немедленного сноса за собой.</gray>"
      - "  <dark_gray>•</dark_gray> <gray>Обязательно закапывайте кратеры от криперов, тушите случайные пожары и подбирайте свой дроп.</gray>"
      - "<red>➜ [Наказание: Кик с предупреждением убрать ➔ при повторном нарушении или отказе: Варн]</red>"

  3:
    title: "<gradient:#008a61:#057285><b>[Страница 3/9] 🏛️ Раздел 3. Спавн и Общественные структуры</b></gradient>"
    lines:
      - "<color:#008a61><b>3.1. Границы Спавна:</b></color> <gray>Территория спавна Верхнего мира (квадрат <b>500×500 блоков</b>) — общественная зона. Самовольно приватить табличками или огораживать участки здесь запрещено.</gray>"
      - "<red>➜ [Наказание: Снос табличек и ограждений + Кик ➔ при повторе Варн]</red>"
      - ""
      - "<color:#008a61><b>3.2. Спавны других миров:</b></color> <gray>Спавн Незера (радиус 100 блоков) и Спавн Энда (весь центральный остров) подчиняются тем же правилам общественной зоны.</gray>"
      - ""
      - "<color:#008a61><b>3.3. Общественные данжи:</b></color> <gray>Ближайшие к спавну крепости Незера, порталы Энда и Дворцы испытаний (Trial Chambers) принадлежат серверу для общего развития. Их застройка и приватизация запрещены. (Монументы и данжи дальше спавна занимать разрешено).</gray>"
      - "<red>➜ [Наказание: Снос построек + Варн / Бан от 3 дней]</red>"
      - ""
      - "<color:#008a61><b>3.4. Строительство на спавне:</b></color> <gray>Любые постройки, декор или торговые палатки на спавне возводятся <b>только после согласования со Старшей администрацией</b> (или Министром спавна).</gray>"
      - "<red>➜ [Наказание: Снос без компенсации + Штраф 64 АР (алмазной руды). При отказе оплатить — Бан до оплаты]</red>"
      - ""
      - "<color:#008a61><b>3.5. Порча общественной зоны:</b></color> <gray>Запрещено портить архитектуру спавна, разливать воду/лаву, устраивать пожары или взрывы.</gray>"
      - "<red>➜ [Наказание: Бан от 14 дней до Перманентного]</red>"
      - ""
      - "<color:#008a61><b>3.6. Расширение территории спавна:</b></color> <gray>При официальном расширении спавна владельцам баз даётся оповещение и <b>7 дней</b> на перенос ресурсов.</gray>"

  4:
    title: "<gradient:#008a61:#057285><b>[Страница 4/9] ⚙️ Раздел 4. Клиенты, Модификации и Стабильность</b></gradient>"
    lines:
      - "<color:#008a61><b>4.1. Честная игра:</b></color> <gray>Категорически запрещено использование любого читерского ПО, макросов, X-Ray ресурспаков и скриптов, дающих нечестное преимущество (список в Разделе 5).</gray>"
      - "<red>➜ [Наказание: Бан от 30 дней до Перманентного + полная очистка инвентаря и эндер-сундука]</red>"
      - ""
      - "<color:#008a61><b>4.2. Разрешённые модификации:</b></color>"
      - "  <dark_gray>•</dark_gray> <gray>Оптимизация: Sodium, Iris, Lithium, OptiFine и аналоги.</gray>"
      - "  <dark_gray>•</dark_gray> <gray>Миникарты: строго <b>без</b> отображения игроков, мобов и пещерного режима.</gray>"
      - "  <dark_gray>•</dark_gray> <gray>Схематика: Litematica (только режим голограммы; авто-принтер запрещён).</gray>"
      - "  <dark_gray>•</dark_gray> <gray>Клиентская косметика и информационные интерфейсы.</gray>"
      - ""
      - "<color:#008a61><b>4.3. Багоюз и эксплойты:</b></color> <gray>Запрещено использование игровых ошибок, дюпов, прохождения сквозь стены. О найденных багах сообщайте в тикеты.</gray>"
      - "<red>➜ [Наказание: Бан от 14 дней до Перманентного + конфискация добытого. За сокрытие критических багов и дюпов — Бан Перманентно]</red>"
      - ""
      - "<color:#008a61><b>4.4. Стабильность сервера:</b></color> <gray>Запрещено строительство лаг-машин, бесконечных редстоун-генераторов без рычагов выключения и механизмов, снижающих TPS сервера.</gray>"
      - "<red>➜ [Наказание: Снос механизма + Бан от 7 дней до Перманентного]</red>"

  5:
    title: "<gradient:#008a61:#057285><b>[Страница 5/9] 🚫 Раздел 5. Список запрещённых чит-модулей</b></gradient>"
    lines:
      - "<gray><i>Использование любого из перечисленных модулей влечёт за собой наказание по п. 4.1:</i></gray>"
      - "<red>➜ [Наказание: Бан от 30 дней до Перманентного + полная очистка инвентаря]</red>"
      - ""
      - "<color:#008a61><b>• Автоматизация и боты:</b></color>"
      - "  <gray>Baritone, AutoFish, AutoMine, AutoFarm, AutoWalk, AutoTool, AutoEat, easy building, clientcommands.</gray>"
      - ""
      - "<color:#008a61><b>• Боевые модули (PvP / Combat):</b></color>"
      - "  <gray>KillAura, AimBot, AimAssist, TriggerBot, AutoTotem, Criticals, Reach, Hitbox, FastBow, AutoMaceSwap, ElytraSwap.</gray>"
      - ""
      - "<color:#008a61><b>• Передвижение (Movement):</b></color>"
      - "  <gray>Fly, BoatFly, Speed, Spider, Phase, Strafe, NoFall, AntiKnockback, NoSlow, JumpAssist, MineHop, Scaffold, Eagle, InventoryMove, ClickPearl.</gray>"
      - ""
      - "<color:#008a61><b>• Рентген и видимость (Render / ESP):</b></color>"
      - "  <gray>X-Ray (моды и текстурпаки), ChestESP, Tracers, Player/Mob ESP, NameTags, ClearWater, ClearLava, FreeCam (сквозь блоки), радар сущностей.</gray>"
      - ""
      - "<color:#008a61><b>• Прочие эксплойты:</b></color>"
      - "  <gray>NoBreakCooldown, Regen и другие пакетные манипуляции.</gray>"
      - ""
      - "<color:#057285>❓ <i>Сомневаетесь в моде? Уточните у Старшей администрации в тикетах Discord перед запуском!</i></color>"

  6:
    title: "<gradient:#008a61:#057285><b>[Страница 6/9] 🎭 Раздел 6. Атмосферные плагины сервера</b></gradient>"
    lines:
      - "<color:#008a61><b>6.1. 🎤 PlasmoVoice (Голосовой чат):</b></color>"
      - "  <dark_gray>•</dark_gray> <gray>Предназначен для ролевого и дружеского общения в игре.</gray>"
      - "  <dark_gray>•</dark_gray> <gray>Запрещено включать саундпады, громкую музыку, крики, скримеры и неприятные шумы в микрофон.</gray>"
      - "<red>➜ [Наказание: Кик ➔ Мут от 1ч до 24ч]</red>"
      - ""
      - "<color:#008a61><b>6.2. 🕺 Emotecraft (Эмоции и жесты):</b></color>"
      - "  <dark_gray>•</dark_gray> <gray>Запрещено использовать анимации для проникновения сквозь текстуры, стены, двери и блоки (багоюз).</gray>"
      - "  <dark_gray>•</dark_gray> <gray>Запрещено спамить анимациями в PvP для искажения хитбокса.</gray>"
      - "<red>➜ [Наказание: Варн ➔ при повторе Бан от 1 до 7 дней]</red>"
      - ""
      - "<color:#008a61><b>6.3. 🍺 BreweryX (Пивоварение):</b></color>"
      - "  <dark_gray>•</dark_gray> <gray>Запрещено намеренно спаивать игроков против их воли с целью ограбления, нанесения вреда или срыва игры. (Разрешено только по взаимному согласию в рамках RP).</gray>"
      - "<red>➜ [Наказание: Кик / Варн. Если привело к потере вещей жертвы — Бан от 1 до 7 дней + возврат вещей]</red>"

  7:
    title: "<gradient:#008a61:#057285><b>[Страница 7/9] 💬 Раздел 7. Общение и культура чата</b></gradient>"
    lines:
      - "<color:#008a61><b>7.1. Уважение и адекватность:</b></color> <gray>Запрещены оскорбления, травля, токсичное поведение и унижение участников как в игре, так и в Discord.</gray>"
      - "<red>➜ [Наказание: Предупреждение / Кик ➔ Мут от 1ч до 24ч (при систематическом нарушении — Бан от 1 до 7 дней)]</red>"
      - ""
      - "<color:#008a61><b>7.2. Деструктивные темы:</b></color> <gray>Строго запрещено разжигание любой розни (национальной, политической, религиозной), экстремистские высказывания и запрещённая символика.</gray>"
      - "<red>➜ [Наказание: Мут от 24ч до Перманентного / Бан от 7 дней до Перманентного]</red>"
      - ""
      - "<color:#008a61><b>7.3. Флуд и спам:</b></color> <gray>Запрещён спам, бессмысленный флуд, злоупотребление капсом.</gray>"
      - "<red>➜ [Наказание: Кик ➔ Мут от 1ч до 12ч]</red>"
      - ""
      - "<color:#008a61><b>7.4. Реклама:</b></color> <gray>Запрещена любая несогласованная реклама сторонних серверов, ресурсов и каналов.</gray>"
      - "<red>➜ [Наказание: Бан Перманентно на сервере и в Discord]</red>"

  8:
    title: "<gradient:#008a61:#057285><b>[Страница 8/9] 💎 Раздел 8. Торговля, Сделки и Регламент тикетов</b></gradient>"
    lines:
      - "<color:#008a61><b>8.1. Честная торговля:</b></color> <gray>Запрещён любой обман при сделках и обмене ресурсами (мошенничество, подмена предметов, невыполнение условий договорённости).</gray>"
      - "<red>➜ [Наказание: Бан от 7 до 30 дней + конфискация и возврат имущества пострадавшему]</red>"
      - ""
      - "<color:#008a61><b>8.2. Фиксация нарушений:</b></color> <gray>Если вас обокрали или загрифферили, зафиксируйте координаты и действия нарушителя через <color:#008a61>/co i</color> и создайте тикет в Discord.</gray>"
      - ""
      - "<color:#008a61><b>8.3. Ложные жалобы:</b></color> <gray>Запрещено создание заведомо ложных тикетов, клевета на других игроков и фабрикация доказательств.</gray>"
      - "<red>➜ [Наказание: Варн ➔ Мут тикетов на 24ч / Бан на 3 дня]</red>"

  9:
    title: "<gradient:#008a61:#057285><b>[Страница 9/9] ⚖️ Раздел 9. Система наказаний и Апелляция</b></gradient>"
    lines:
      - "<gray>Для поддержания порядка на сервере действует 4-уровневая система дисциплинарных мер:</gray>"
      - ""
      - "<color:#008a61><b>1. Кик (Kick):</b></color> <gray>Оперативная мера при мелких нарушениях и порче экологии (столбы, деревья).</gray>"
      - "<color:#008a61><b>2. Мут (Mute):</b></color> <gray>Ограничение текстового и голосового чата (от 1 часа до Перманентного).</gray>"
      - "<color:#008a61><b>3. Варн (Warn):</b></color> <gray>Официальный выговор. <red><b>3 варна = Автоматический Перманентный бан</b></red>.</gray>"
      - "   <dark_gray>⏳ Каждый полученный варн автоматически сгорает через <b>30 дней</b> с момента выдачи.</dark_gray>"
      - "<color:#008a61><b>4. Бан (Ban):</b></color> <gray>Блокировка доступа к серверу (от 1 часа до Перманентного). Сопровождается очисткой инвентаря и <color:#008a61>/co rollback</color>.</gray>"
      - ""
      - "<color:#057285><b>📩 Обжалование наказаний (Апелляция):</b></color>"
      - "<gray>Откройте тикет в Discord и спокойно, без агрессии, изложите свою позицию и доказательства. Все апелляции рассматриваются индивидуально.</gray>"
      - ""
      - "<gradient:#008a61:#057285><b>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</b></gradient>"
      - "<color:#008a61><b>🎉 Спасибо за прочтение правил! Желаем приятной и комфортной игры! 🍺⛏️</b></color>"
      - "<gray>Нажмите кнопку ниже для подтверждения и начала игры (без задержки):</gray>"
