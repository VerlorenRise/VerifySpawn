# ============================================================== #
#                    SpawnGate - Правила сервера                 #
# ============================================================== #
# Палитра сервера: #008a61 и #057285
# Поддерживается MiniMessage: <gradient>, <color>, <bold>, <click>, <hover>.

pages:
  1:
    title: "<gradient:#008a61:#057285><b>[Страница 1/7] 1. Общие положения</b></gradient>"
    lines:
      - "<color:#008a61><b>1.1.</b></color> <gray>Правила действуют на всей территории сервера (Minecraft + Discord) и обязательны для всех игроков.</gray>"
      - ""
      - "<color:#008a61><b>1.2.</b></color> <gray>Администрация всегда готова помочь, но просим относиться к её решениям с уважением. Любые спорные вопросы решаются через систему тикетов в Discord.</gray>"
      - ""
      - "<color:#008a61><b>1.3.</b></color> <gray>Администрация оставляет за собой право принимать решения в нестандартных ситуациях, которые не описаны в правилах, с целью сохранения комфортной атмосферы.</gray>"

  2:
    title: "<gradient:#008a61:#057285><b>[Страница 2/7] 2. Читы и гриферство</b></gradient>"
    lines:
      - "<red><b>🚫 Запрещено:</b></red>"
      - "<color:#008a61><b>2.1.</b></color> <gray>Использование любых читов, X-Ray текстур, макросов и стороннего ПО, дающего преимущество над другими игроками.</gray>"
      - "<dark_gray>(Исключение — OptiFine, Sodium, мини-карты без указания сущностей и клиентские косметические моды)</dark_gray>"
      - ""
      - "<color:#008a61><b>2.2.</b></color> <gray>Гриферство и воровство. Не ломайте и не забирайте чужие постройки, сундуки, механизмы и ресурсы без разрешения владельца.</gray>"
      - ""
      - "<color:#057285><b>2.2.1.</b></color> <gray>Если база заброшена более 30 дней, она официально считается заброшенной. Узнать об этом можно через команду <color:#008a61>/co i</color>. Если вы видите, что владелец был в сети свыше 30 дней, базу можно разбирать (забирать ресурсы или территорию полностью). Если вы не уверены, что база заброшена, лучше спросить у администратора. (Взрывать тнт или строить лава-касты всё ещё запрещено.)</gray>"
      - ""
      - "<color:#057285><b>2.2.2.</b></color> <gray>Фармы входят в исключение. Если на фарме никто ничего не трогал, не строил, она не является заброшенной. Это касается ферм опыта, ферм каких-то ресурсов и так далее.</gray>"

  3:
    title: "<gradient:#008a61:#057285><b>[Страница 3/7] 2. PvP, территории и структуры</b></gradient>"
    lines:
      - "<color:#008a61><b>2.3.</b></color> <gray>PvP разрешено только по обоюдному согласию участников. Убийство без предупреждения приравнивается к гриферству.</gray>"
      - ""
      - "<color:#008a61><b>2.4.</b></color> <gray>Строительство вплотную к чужим базам. Отступайте минимум <b>300 блоков</b> от чужих построек, если не получили устного согласия соседа.</gray>"
      - ""
      - "<color:#008a61><b>2.5.</b></color> <gray>Оставлять после себя мусор и разрушения. Забирайте выпавшие предметы, тушите пожары, закапывайте ямы и кратеры после взрывов криперов.</gray>"
      - ""
      - "<color:#008a61><b>2.6.</b></color> <gray>Самые ближайшие Структуры: именно крепости Ада, крепости Энда, Данжей испытаний. Принадлежат спавну, их застройка запрещена.</gray>"
      - ""
      - "<color:#057285><b>2.6.1.</b></color> <dark_gray>Исключение: Заприватить можно любые монументы, кроме самых ближайших к спавну. (Спавну по аду/энду)</dark_gray>"

  4:
    title: "<gradient:#008a61:#057285><b>[Страница 4/7] 4. Правила общения</b></gradient>"
    lines:
      - "<color:#008a61><b>4.1.</b></color> <gray>Запрещены оскорбления, унижения, разжигание конфликтов на национальной, религиозной или политической почве. У нас дружное сообщество — относитесь ко всем с уважением.</gray>"
      - ""
      - "<color:#008a61><b>4.2.</b></color> <gray>Не флудите в важных каналах. Для разговоров есть общий чат и голосовые каналы.</gray>"
      - ""
      - "<color:#008a61><b>4.3.</b></color> <gray>Запрещена реклама сторонних серверов, каналов и ресурсов без разрешения администрации.</gray>"
      - ""
      - "<color:#008a61><b>4.4.</b></color> <gray>Для вопросов к администрации используйте специальный канал. (Не пишите в личные сообщения, если только админ сам не попросил вас о личной переписке)</gray>"

  5:
    title: "<gradient:#008a61:#057285><b>[Страница 5/7] 7. Территория спавна: статус и строительство</b></gradient>"
    lines:
      - "<color:#008a61><b>7.1. Границы и статус территории:</b></color>"
      - "<gray>Спавн является общественной зоной размером <b>500х500 блоков</b> и не принадлежит ни одному игроку. Приватить, захватывать или огораживать участки на спавне строго запрещено.</gray>"
      - "<dark_gray>7.1.1. На спавны Ада и Энда распространяются те же самые правила, за исключением размера спавна. (ад - 100 энд - Весь остров)</dark_gray>"
      - ""
      - "<color:#008a61><b>7.2. Расширение территории спавна:</b></color>"
      - "<gray>В случае официального расширения границ спавна игроки, чьи базы или постройки окажутся в новой зоне, получают предварительное уведомление. Владельцу даётся <b>7 дней</b> на перенос базы и ценных ресурсов. По истечении этого срока оставшиеся постройки подлежат полному сносу.</gray>"
      - ""
      - "<color:#008a61><b>7.3. Регламент строительства:</b></color>"
      - "<gray>Любое строительство, изменение ландшафта, снос объектов или установка декораций в пределах территории спавна разрешены исключительно по официальному согласованию с <b>Министром спавна</b>. При отсутствии Министра спавна запрос подаётся старшей администрации (например, игроку <color:#057285>VerlorenRise</color>). Министр спавна или старшая администрация может запросить оплату за продажу или аренду места.</gray>"

  6:
    title: "<gradient:#008a61:#057285><b>[Страница 6/7] 7. Спавн: самострой, торговля и порядок</b></gradient>"
    lines:
      - "<color:#008a61><b>7.4. Самовольное строительство:</b></color>"
      - "<gray>Любые постройки, сундуки, механизмы или фермы, возведённые на территории спавна без предварительного одобрения Министра или старшей администрации, подлежат сносу без компенсации ресурсов. На нарушителя накладывается штраф в размере <b>64 АР</b> (алмазной руды).</gray>"
      - ""
      - "<color:#008a61><b>7.5. Торговля и ярмарочные места:</b></color>"
      - "<gray>Установка торговых точек, палаток или магазинов на спавне допускается только на специально отведённых площадках и строго после одобрения Министром спавна (либо старшей администрацией).</gray>"
      - ""
      - "<color:#008a61><b>7.6. Порядок и порча общественной зоны:</b></color>"
      - "<gray>Запрещено портить архитектуру спавна, ломать общественные блоки, разливать жидкости (воду, лаву), разводить огонь, взрывать динамит или намеренно засорять территорию. Нарушение карается баном по пункту 2.2 общих правил сервера.</gray>"

  7:
    title: "<gradient:#008a61:#057285><b>[Страница 7/7] 6. Администрация и Согласие</b></gradient>"
    lines:
      - "<color:#008a61><b>6.1.</b></color> <gray>Администрация оставляет за собой право принимать решения в нестандартных ситуациях, которые не описаны в правилах, с целью сохранения комфортной атмосферы.</gray>"
      - ""
      - "<color:#008a61><b>6.2.</b></color> <gray>Если вам кажется, что администратор ошибся, создайте тикет и вежливо изложите свою позицию. Все вопросы решаются конструктивно.</gray>"
      - ""
      - "<gradient:#008a61:#057285><b>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</b></gradient>"
      - "<color:#008a61><b>🎉 Спасибо, что уделили время чтению!</b></color>"
      - "<color:#057285>Приятной игры и вкусного пива из BreweryX! 🍺⛏️</color>"
      - "<gray>Нажмите кнопку ниже для подтверждения и начала игры (без задержки):</gray>"
